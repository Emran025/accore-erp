[package]
name = "accore-desktop"
version = "1.1.1"
description = "ACCORE ERP Desktop application"
authors = ["Accore ERP Contributors"]
license = "MIT"
repository = "https://github.com/Emran025/accore-erp"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[features]
default = []
server-product = ["dep:accore-server-agent", "dep:accore-api-runtime", "dep:accoredb-runtime"]
client-product = []

[dependencies]
accore-installer-core = { path = "../../distribution/crates/accore-installer-core" }
accore-server-agent = { path = "../../distribution/crates/accore-server-agent", optional = true }
accore-api-runtime = { path = "../../distribution/crates/accore-api-runtime", optional = true }
accoredb-runtime = { path = "../../distribution/crates/accoredb-runtime", optional = true }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-stronghold = "2.3.1"
tauri-plugin-updater = "2.10.0"
keyring = { version = "4.1.6", features = ["v1"] }
rand = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"

[profile.dev.package.scrypt]
opt-level = 3

components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
        data:
          type: object
          description: 'The response payload'
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 4
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'An error occurred'
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'The given data was invalid'
        errors:
          type: object
          description: 'Validation errors keyed by field name'
          additionalProperties:
            type: array
            items:
              type: string
    StorePerformanceGoalRequest:
      type: object
      properties:
        employee_id:
          type: integer
        goal_title:
          maxLength: 255
          type: string
        goal_description:
          type: string
        goal_type:
          enum:
            - okr
            - kpi
            - personal
            - team
            - corporate
          type: string
        parent_goal_id:
          nullable: true
          type: integer
        target_value:
          nullable: true
          type: number
        current_value:
          nullable: true
          type: number
        unit:
          maxLength: 50
          nullable: true
          type: string
        start_date:
          format: date
          type: string
        target_date:
          format: date
          type: string
        notes:
          nullable: true
          type: string
      required:
        - employee_id
        - goal_title
        - goal_description
        - goal_type
        - start_date
        - target_date
    StorePerformanceAppraisalRequest:
      type: object
      properties:
        employee_id:
          type: integer
        appraisal_type:
          enum:
            - self
            - manager
            - peer
            - '360'
            - annual
            - mid_year
          type: string
        appraisal_period:
          maxLength: 50
          type: string
        appraisal_date:
          format: date
          type: string
        manager_id:
          nullable: true
          type: integer
        ratings:
          nullable: true
          type: array
          items:
            type: object
        notes:
          nullable: true
          type: string
      required:
        - employee_id
        - appraisal_type
        - appraisal_period
        - appraisal_date
    StoreContinuousFeedbackRequest:
      type: object
      properties:
        employee_id:
          type: integer
        feedback_type:
          enum:
            - check_in
            - praise
            - improvement
            - coaching
            - other
          type: string
        feedback_content:
          type: string
        feedback_date:
          format: date
          type: string
        is_visible_to_employee:
          type: boolean
        notes:
          nullable: true
          type: string
      required:
        - employee_id
        - feedback_type
        - feedback_content
        - feedback_date
    UpdatePerformanceGoalRequest:
      type: object
      properties:
        goal_title:
          maxLength: 255
          type: string
        goal_description:
          type: string
        status:
          enum:
            - not_started
            - in_progress
            - on_track
            - at_risk
            - completed
            - cancelled
          type: string
        target_value:
          nullable: true
          type: number
        current_value:
          nullable: true
          type: number
        progress_percentage:
          minimum: 0.0
          maximum: 100.0
          nullable: true
          type: integer
        notes:
          nullable: true
          type: string
    UpdatePerformanceAppraisalRequest:
      type: object
      properties:
        status:
          enum:
            - draft
            - self_review
            - manager_review
            - calibration
            - completed
            - cancelled
          type: string
        ratings:
          nullable: true
          type: array
          items:
            type: object
        self_assessment:
          nullable: true
          type: string
        manager_feedback:
          nullable: true
          type: string
        peer_feedback:
          nullable: true
          type: string
        overall_rating:
          minimum: 1.0
          maximum: 5.0
          nullable: true
          type: number
        notes:
          nullable: true
          type: string
    StoreLearningCourseRequest:
      type: object
      properties:
        course_code:
          maxLength: 50
          type: string
        course_name:
          maxLength: 255
          type: string
        description:
          nullable: true
          type: string
        delivery_method:
          enum:
            - in_person
            - virtual
            - elearning
            - blended
          type: string
        course_type:
          enum:
            - mandatory
            - optional
            - compliance
            - development
          type: string
        duration_hours:
          minimum: 0.0
          nullable: true
          type: integer
        scorm_path:
          nullable: true
          type: string
        video_url:
          format: uri
          nullable: true
          type: string
        is_recurring:
          type: boolean
        recurrence_months:
          minimum: 1.0
          nullable: true
          type: integer
        requires_assessment:
          type: boolean
        passing_score:
          minimum: 0.0
          maximum: 100.0
          nullable: true
          type: integer
        notes:
          nullable: true
          type: string
      required:
        - course_code
        - course_name
        - delivery_method
        - course_type
    UpdateLearningCourseRequest:
      type: object
      properties:
        course_name:
          maxLength: 255
          type: string
        description:
          nullable: true
          type: string
        is_published:
          type: boolean
        notes:
          nullable: true
          type: string
    StoreLearningEnrollmentRequest:
      type: object
      properties:
        course_id:
          type: integer
        employee_id:
          type: integer
        enrollment_type:
          enum:
            - assigned
            - self_enrolled
            - mandatory
          type: string
        due_date:
          format: date
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
      required:
        - course_id
        - employee_id
        - enrollment_type
    UpdateLearningEnrollmentRequest:
      type: object
      properties:
        status:
          enum:
            - enrolled
            - in_progress
            - completed
            - failed
            - dropped
          type: string
        progress_percentage:
          minimum: 0.0
          maximum: 100.0
          nullable: true
          type: integer
        score:
          minimum: 0.0
          maximum: 100.0
          nullable: true
          type: integer
        completion_date:
          format: date
          nullable: true
          type: string
    StoreSuccessionPlanRequest:
      type: object
      properties:
        position_title:
          maxLength: 255
          type: string
        incumbent_id:
          nullable: true
          type: integer
        readiness_level:
          enum:
            - ready_now
            - ready_1_2_years
            - ready_3_5_years
            - not_ready
          type: string
        notes:
          nullable: true
          type: string
      required:
        - position_title
        - readiness_level
    UpdateSuccessionPlanRequest:
      type: object
      properties:
        status:
          enum:
            - active
            - inactive
            - filled
          type: string
        readiness_level:
          enum:
            - ready_now
            - ready_1_2_years
            - ready_3_5_years
            - not_ready
          type: string
        notes:
          nullable: true
          type: string
    StoreSuccessionCandidateRequest:
      type: object
      properties:
        employee_id:
          type: integer
        readiness_level:
          enum:
            - ready_now
            - ready_1_2_years
            - ready_3_5_years
            - not_ready
          type: string
        performance_rating:
          minimum: 1.0
          maximum: 5.0
          nullable: true
          type: integer
        potential_rating:
          minimum: 1.0
          maximum: 5.0
          nullable: true
          type: integer
        development_plan:
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
      required:
        - employee_id
        - readiness_level
    UpdateSuccessionCandidateRequest:
      type: object
      properties:
        readiness_level:
          enum:
            - ready_now
            - ready_1_2_years
            - ready_3_5_years
            - not_ready
          type: string
        performance_rating:
          minimum: 1.0
          maximum: 5.0
          nullable: true
          type: integer
        potential_rating:
          minimum: 1.0
          maximum: 5.0
          nullable: true
          type: integer
        development_plan:
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: 'Session token obtained from the login endpoint'

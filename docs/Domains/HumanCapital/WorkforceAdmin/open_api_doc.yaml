components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
        data:
          type: object
          description: 'The response payload'
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 4
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'An error occurred'
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'The given data was invalid'
        errors:
          type: object
          description: 'Validation errors keyed by field name'
          additionalProperties:
            type: array
            items:
              type: string
    StoreBenefitsPlanRequest:
      type: object
      properties:
        plan_code:
          maxLength: 50
          type: string
        plan_name:
          maxLength: 255
          type: string
        plan_type:
          enum:
            - health
            - dental
            - vision
            - life_insurance
            - disability
            - retirement
            - fsa
            - hsa
            - other
          type: string
        description:
          nullable: true
          type: string
        eligibility_rule:
          enum:
            - all
            - full_time
            - tenure
            - role
            - custom
          type: string
        eligibility_criteria:
          nullable: true
          type: array
          items:
            type: object
        employee_contribution:
          minimum: 0.0
          nullable: true
          type: number
        employer_contribution:
          minimum: 0.0
          nullable: true
          type: number
        effective_date:
          format: date
          type: string
        expiry_date:
          format: date
          nullable: true
          type: string
      required:
        - plan_code
        - plan_name
        - plan_type
        - eligibility_rule
        - effective_date
    UpdateBenefitsPlanRequest:
      type: object
      properties:
        plan_name:
          maxLength: 255
          type: string
        description:
          nullable: true
          type: string
        is_active:
          type: boolean
        expiry_date:
          format: date
          nullable: true
          type: string
    StoreBenefitsEnrollmentRequest:
      type: object
      properties:
        plan_id:
          type: integer
        employee_id:
          type: integer
        enrollment_type:
          enum:
            - open_enrollment
            - new_hire
            - life_event
            - qualifying_event
          type: string
        effective_date:
          format: date
          type: string
        coverage_details:
          nullable: true
          type: array
          items:
            type: object
        notes:
          nullable: true
          type: string
      required:
        - plan_id
        - employee_id
        - enrollment_type
        - effective_date
    UpdateBenefitsEnrollmentRequest:
      type: object
      properties:
        id:
          type: integer
        status:
          enum:
            - enrolled
            - active
            - terminated
            - cancelled
          type: string
        termination_date:
          format: date
          nullable: true
          type: string
        coverage_details:
          nullable: true
          type: array
          items:
            type: object
        notes:
          nullable: true
          type: string
      required:
        - id
    StoreRelationsCaseRequest:
      type: object
      properties:
        employee_id:
          type: integer
        case_type:
          enum:
            - grievance
            - disciplinary
            - investigation
            - whistleblowing
            - complaint
            - other
          type: string
        confidentiality_level:
          enum:
            - public
            - confidential
            - highly_confidential
          type: string
        description:
          type: string
        assigned_to:
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
      required:
        - employee_id
        - case_type
        - confidentiality_level
        - description
    UpdateRelationsCaseRequest:
      type: object
      properties:
        status:
          enum:
            - open
            - under_investigation
            - hearing
            - resolved
            - closed
            - escalated
          type: string
        resolution:
          nullable: true
          type: string
        resolved_date:
          format: date
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
    StoreDisciplinaryActionRequest:
      type: object
      properties:
        employee_id:
          type: integer
        action_type:
          enum:
            - verbal_warning
            - written_warning
            - final_warning
            - suspension
            - termination
            - other
          type: string

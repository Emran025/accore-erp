components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
        data:
          type: object
          description: 'The response payload'
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 4
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'An error occurred'
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'The given data was invalid'
        errors:
          type: object
          description: 'Validation errors keyed by field name'
          additionalProperties:
            type: array
            items:
              type: string
    PayIndividualItemRequest:
      type: object
      properties:
        amount:
          minimum: 0.0
          type: number
        notes:
          nullable: true
          type: string
        account_id:
          nullable: true
          type: integer
      required:
        - amount
    UpdatePayrollItemRequest:
      type: object
      properties:
        base_salary:
          minimum: 0.0
          type: number
        total_allowances:
          minimum: 0.0
          type: number
        total_deductions:
          minimum: 0.0
          type: number
        notes:
          nullable: true
          type: string
      required:
        - base_salary
        - total_allowances
        - total_deductions
    StorePayrollComponentRequest:
      type: object
      properties:
        component_code:
          maxLength: 50
          type: string
        component_name:
          maxLength: 100
          type: string
        component_type:
          enum:
            - allowance
            - deduction
            - overtime
            - bonus
            - other
          type: string
        calculation_type:
          enum:
            - fixed
            - percentage
            - formula
            - attendance_based
          type: string
        base_amount:
          minimum: 0.0
          nullable: true
          type: number
        percentage:
          minimum: 0.0
          maximum: 100.0
          nullable: true
          type: number
        formula:
          nullable: true
          type: string
        is_taxable:
          type: boolean
        is_active:
          type: boolean
        display_order:
          minimum: 0.0
          type: integer
        description:
          nullable: true
          type: string
      required:
        - component_code
        - component_name
        - component_type
        - calculation_type
    UpdatePayrollComponentRequest:
      type: object
      properties:
        component_code:
          maxLength: 50
          type: string
        component_name:
          maxLength: 100
          type: string
        component_type:
          enum:
            - allowance
            - deduction
            - overtime
            - bonus
            - other
          type: string
        calculation_type:
          enum:
            - fixed
            - percentage
            - formula
            - attendance_based
          type: string
        base_amount:
          minimum: 0.0
          nullable: true
          type: number
        percentage:
          minimum: 0.0
          maximum: 100.0
          nullable: true
          type: number
        formula:
          nullable: true
          type: string
        is_taxable:
          type: boolean
        is_active:
          type: boolean
        display_order:
          minimum: 0.0
          type: integer
        description:
          nullable: true
          type: string
    StorePostPayrollIntegrationRequest:
      type: object
      properties:
        payroll_cycle_id:
          type: integer
        integration_type:
          enum:
            - bank_file
            - gl_entry
            - third_party_pay
            - garnishment
          type: string
        file_format:
          maxLength: 50
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
      required:
        - payroll_cycle_id
        - integration_type
    ReconcilePostPayrollIntegrationRequest:
      type: object
      properties:
        reconciled_amount:
          minimum: 0.0
          type: number
      required:
        - reconciled_amount
    StoreCompensationPlanRequest:
      type: object
      properties:
        plan_name:
          maxLength: 255
          type: string
        plan_type:
          enum:
            - merit
            - promotion
            - adjustment
            - bonus
            - commission
          type: string
        fiscal_year:
          maxLength: 10
          type: string
        effective_date:
          format: date
          type: string
        budget_pool:
          minimum: 0.0
          nullable: true
          type: number
        notes:
          nullable: true
          type: string
      required:
        - plan_name
        - plan_type
        - fiscal_year
        - effective_date
    UpdateCompensationPlanRequest:
      type: object
      properties:
        status:
          enum:
            - draft
            - pending_approval
            - approved
            - active
            - closed
          type: string
        notes:
          nullable: true
          type: string
    StoreCompensationEntryRequest:
      type: object
      properties:
        compensation_plan_id:
          type: integer
        employee_id:
          type: integer
        current_salary:
          minimum: 0.0
          type: number
        proposed_salary:
          minimum: 0.0
          type: number
        comp_ratio:
          minimum: 0.0
          maximum: 2.0
          nullable: true
          type: number
        justification:
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
      required:
        - compensation_plan_id
        - employee_id
        - current_salary
        - proposed_salary
    UpdateCompensationEntryStatusRequest:
      type: object
      properties:
        status:
          enum:
            - pending
            - approved
            - rejected
            - processed
          type: string
      required:
        - status
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: 'Session token obtained from the login endpoint'

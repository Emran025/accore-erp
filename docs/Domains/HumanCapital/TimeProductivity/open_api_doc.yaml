components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
        data:
          type: object
          description: 'The response payload'
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 4
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'An error occurred'
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'The given data was invalid'
        errors:
          type: object
          description: 'Validation errors keyed by field name'
          additionalProperties:
            type: array
            items:
              type: string
    StoreAttendanceRequest:
      type: object
      properties:
        employee_id:
          type: integer
        attendance_date:
          format: date
          type: string
        check_in:
          format: date-time
          nullable: true
          type: string
        check_out:
          format: date-time
          nullable: true
          type: string
        status:
          enum:
            - present
            - absent
            - leave
            - holiday
            - weekend
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
        source:
          enum:
            - manual
            - biometric
            - import
          nullable: true
          type: string
      required:
        - employee_id
        - attendance_date
    BulkImportAttendanceRequest:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              employee_id:
                type: integer
              date:
                format: date
                type: string
              check_in:
                format: date-time
                nullable: true
                type: string
              check_out:
                format: date-time
                nullable: true
                type: string
              status:
                enum:
                  - present
                  - absent
                  - leave
                  - holiday
                  - weekend
                nullable: true
                type: string
            required:
              - employee_id
              - date
      required:
        - records
    StoreLeaveRequest:
      type: object
      properties:
        employee_id:
          type: integer
        leave_type:
          enum:
            - vacation
            - sick
            - emergency
            - unpaid
            - other
          type: string
        start_date:
          format: date
          type: string
        end_date:
          format: date
          type: string
        reason:
          nullable: true
          type: string
      required:
        - employee_id
        - leave_type
        - start_date
        - end_date
    ActionLeaveRequest:
      type: object
      properties:
        action:
          enum:
            - approved
            - rejected
          type: string
        reason:
          nullable: true
          type: string
      required:
        - action
    StoreWorkforceScheduleRequest:
      type: object
      properties:
        schedule_name:
          maxLength: 255
          type: string
        schedule_date:
          format: date
          type: string
        department_id:
          nullable: true
          type: integer
        notes:
          nullable: true
          type: string
      required:
        - schedule_name
        - schedule_date
    UpdateWorkforceScheduleRequest:
      type: object
      properties:
        schedule_name:
          maxLength: 255
          type: string
        status:
          enum:
            - draft
            - published
            - archived
          type: string
        notes:
          nullable: true
          type: string
    StoreScheduleShiftRequest:
      type: object
      properties:
        employee_id:
          type: integer
        shift_date:
          format: date
          type: string
        start_time:
          type: string
        end_time:
          type: string
        shift_type:
          enum:
            - regular
            - overtime
            - on_call
            - standby
          type: string
        notes:
          nullable: true
          type: string
      required:
        - employee_id
        - shift_date
        - start_time
        - end_time
        - shift_type
    UpdateWorkforceShiftRequest:
      type: object
      properties:
        status:
          enum:
            - scheduled
            - confirmed
            - swapped
            - cancelled
            - completed
          type: string
        swapped_with:
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
    StoreBiometricDeviceRequest:
      type: object
      properties:
        device_name:
          maxLength: 255
          type: string
        device_ip:
          maxLength: 45
          nullable: true
          type: string
        device_port:
          nullable: true
          type: integer
        serial_number:
          maxLength: 100
          nullable: true
          type: string
        location:
          maxLength: 255
          nullable: true
          type: string
      required:
        - device_name
    UpdateBiometricDeviceRequest:
      type: object
      properties:
        device_name:
          maxLength: 255
          type: string
        device_ip:
          maxLength: 45
          nullable: true
          type: string
        device_port:
          nullable: true
          type: integer
        serial_number:
          maxLength: 100
          nullable: true
          type: string
        location:
          maxLength: 255
          nullable: true
          type: string
        status:
          enum:
            - online
            - offline
            - maintenance
            - error
          type: string
        is_active:
          type: boolean
    SyncBiometricDeviceRequest:
      type: object
      properties:
        records:
          nullable: true
          type: array
          items:
            type: object
            properties:
              employee_code:
                type: string
              check_in:
                format: date
                type: string
              check_out:
                format: date
                nullable: true
                type: string
              attendance_date:
                format: date
                type: string
            required:
              - employee_code
              - check_in
              - attendance_date
    ImportBiometricDeviceRequest:
      type: object
      properties:
        device_id:
          type: integer
        file:
          format: binary
          maxLength: 10240
          type: string
      required:
        - device_id
        - file
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: 'Session token obtained from the login endpoint'

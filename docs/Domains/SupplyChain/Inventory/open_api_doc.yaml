          description: 'The unique numeric ID of the resource'
          schema:
            type: integer
      responses:
        200:
          description: 'Successful operation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        400:
          description: 'Validation error or bad request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: 'Unauthenticated — missing or expired session token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: 'Forbidden — insufficient permissions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Resource not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        422:
          description: 'Unprocessable entity — validation failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        500:
          description: 'Internal server error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
        data:
          type: object
          description: 'The response payload'
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 4
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'An error occurred'
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'The given data was invalid'
        errors:
          type: object
          description: 'Validation errors keyed by field name'
          additionalProperties:
            type: array
            items:
              type: string
    StoreProductRequest:
      type: object
      properties:
        name:
          maxLength: 255
          type: string
        description:
          nullable: true
          type: string
        category_id:
          nullable: true
          type: integer
        unit_price:
          minimum: 0.0
          type: number
        minimum_profit_margin:
          minimum: 0.0
          nullable: true
          type: number
        stock_quantity:
          minimum: 0.0
          nullable: true
          type: integer
        unit_name:
          maxLength: 50
          nullable: true
          type: string
        items_per_unit:
          minimum: 1.0
          nullable: true
          type: integer
        sub_unit_name:
          maxLength: 50
          nullable: true
          type: string
        sku:
          maxLength: 100
          nullable: true
          type: string
        price:
          minimum: 0.0
          nullable: true
          type: number
        purchase_price:
          minimum: 0.0
          nullable: true
          type: number
        low_stock_threshold:
          minimum: 0.0
          nullable: true
          type: integer
        unit:
          maxLength: 50
          nullable: true
          type: string
        barcode:
          maxLength: 100
          nullable: true
          type: string
        is_active:
          nullable: true
          type: boolean
      required:
        - name
        - unit_price
    StoreCategoryRequest:
      type: object
      properties:
        name:
          maxLength: 100
          type: string
      required:
        - name
    UpdateCategoryRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          maxLength: 100
          type: string
      required:
        - id
        - name
    StorePeriodicInventoryRequest:
      type: object
      properties:
        product_id:
          type: integer
        counted_quantity:
          minimum: 0.0
          type: integer
        count_date:
          format: date
          nullable: true
          type: string
        fiscal_period_id:
          type: integer
        notes:
          nullable: true
          type: string
      required:
        - product_id
        - counted_quantity
        - fiscal_period_id
    ProcessPeriodicInventoryRequest:
      type: object
      properties:
        fiscal_period_id:
          type: integer
      required:
        - fiscal_period_id
    StoreBatchRequest:
      type: object
      properties:
        batch_name:
          maxLength: 100
          type: string
        batch_type:
          maxLength: 50
          type: string
        description:
          nullable: true
          type: string
        action:
          nullable: true
          type: string
        batch_id:
          type: integer
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: 'Session token obtained from the login endpoint'

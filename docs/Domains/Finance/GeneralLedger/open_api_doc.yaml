components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
        data:
          type: object
          description: 'The response payload'
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 4
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'An error occurred'
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'The given data was invalid'
        errors:
          type: object
          description: 'Validation errors keyed by field name'
          additionalProperties:
            type: array
            items:
              type: string
    StoreRecurringTransactionRequest:
      type: object
      properties:
        name:
          maxLength: 255
          type: string
        type:
          type: string
        frequency:
          type: string
        next_due_date:
          format: date
          type: string
        template_data:
          type: array
          items:
            type: object
        action:
          enum:
            - process
          nullable: true
          type: string
      required:
        - name
        - type
        - frequency
        - next_due_date
        - template_data
    UpdateRecurringTransactionRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          maxLength: 255
          type: string
        type:
          type: string
        frequency:
          type: string
        next_due_date:
          format: date
          type: string
        template_data:
          type: array
          items:
            type: object
      required:
        - id
        - name
        - type
        - frequency
        - next_due_date
        - template_data
    ProcessRecurringTransactionRequest:
      type: object
      properties:
        template_id:
          type: integer
        generation_date:
          format: date
          nullable: true
          type: string
      required:
        - template_id
    StoreChartOfAccountRequest:
      type: object
      properties:
        code:
          maxLength: 20
          type: string
        name:
          maxLength: 255
          type: string
        type:
          enum:
            - asset
            - liability
            - equity
            - revenue
            - expense
          type: string
        parent_id:
          nullable: true
          type: integer
        description:
          nullable: true
          type: string
      required:
        - code
        - name
        - type
    UpdateChartOfAccountRequest:
      type: object
      properties:
        name:
          maxLength: 255
          type: string
        type:
          enum:
            - asset
            - liability
            - equity
            - revenue
            - expense
          type: string
        parent_id:
          nullable: true
          type: integer
        description:
          nullable: true
          type: string
        is_active:
          nullable: true
          type: boolean
      required:
        - name
        - type
    StoreFiscalPeriodRequest:
      type: object
      properties:
        period_name:
          maxLength: 100
          type: string
        start_date:
          format: date
          type: string
        end_date:
          format: date
          type: string
      required:
        - period_name
        - start_date
        - end_date
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: 'Session token obtained from the login endpoint'

          type: number
        is_active:
          type: boolean
      required:
        - name
        - code
        - policy_type
        - conversion_timing
    UpdateCurrencyPolicyRequest:
      type: object
      properties:
        name:
          maxLength: 100
          type: string
        code:
          maxLength: 20
          type: string
        description:
          nullable: true
          type: string
        policy_type:
          enum:
            - '"UNIT_OF_MEASURE"'
            - '"VALUED_ASSET"'
            - '"NORMALIZATION"'
          type: string
        requires_reference_currency:
          type: boolean
        allow_multi_currency_balances:
          type: boolean
        conversion_timing:
          enum:
            - '"POSTING"'
            - '"SETTLEMENT"'
            - '"REPORTING"'
            - '"NEVER"'
          type: string
        revaluation_enabled:
          type: boolean
        revaluation_frequency:
          enum:

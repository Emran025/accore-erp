        errors:
          type: object
          description: 'Validation errors keyed by field name'
          additionalProperties:
            type: array
            items:
              type: string
    StoreCurrencyRequest:
      type: object
      properties:
        code:
          maxLength: 3
          type: string
        name:
          maxLength: 255
          type: string
        symbol:
          maxLength: 10
          type: string
        exchange_rate:
          minimum: 0.0
          type: number
        is_active:
          type: boolean
        denominations:

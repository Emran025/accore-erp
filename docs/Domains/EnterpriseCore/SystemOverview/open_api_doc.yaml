components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
        data:
          type: object
          description: 'The response payload'
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 4
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'An error occurred'
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'The given data was invalid'
        errors:
          type: object
          description: 'Validation errors keyed by field name'
          additionalProperties:
            type: array
            items:
              type: string
    StoreNrObjectRequest:
      type: object
      properties:
        object_type:
          maxLength: 50
          type: string
        name:
          maxLength: 255
          type: string
        name_en:
          maxLength: 255
          nullable: true
          type: string
        description:
          maxLength: 500
          nullable: true
          type: string
        number_length:
          minimum: 1.0
          maximum: 20.0
          type: integer
        prefix:
          maxLength: 10
          nullable: true
          type: string
      required:
        - object_type
        - name
        - number_length
    UpdateNrObjectRequest:
      type: object
      properties:
        name:
          maxLength: 255
          type: string
        name_en:
          maxLength: 255
          nullable: true
          type: string
        description:
          maxLength: 500
          nullable: true
          type: string
        number_length:
          minimum: 1.0
          maximum: 20.0
          type: integer
        prefix:
          maxLength: 10
          nullable: true
          type: string
        is_active:
          type: boolean
    StoreNrGroupRequest:
      type: object
      properties:
        code:
          maxLength: 20
          type: string
        name:
          maxLength: 255
          type: string
        name_en:
          maxLength: 255
          nullable: true
          type: string
        description:
          maxLength: 500
          nullable: true
          type: string
      required:
        - code
        - name
    StoreNrIntervalRequest:
      type: object
      properties:
        code:
          maxLength: 20
          type: string
        description:
          maxLength: 500
          nullable: true
          type: string
        from_number:
          minimum: 1.0
          type: integer
        to_number:
          minimum: 1.0
          type: integer
        is_external:
          type: boolean
      required:
        - code
        - from_number
        - to_number
    ExpandNrIntervalRequest:
      type: object
      properties:
        new_to:
          minimum: 1.0
          type: integer
        reason:
          maxLength: 500
          nullable: true
          type: string
      required:
        - new_to
    StoreNrAssignmentRequest:
      type: object
      properties:
        nr_group_id:
          type: integer
        nr_interval_id:
          type: integer
      required:
        - nr_group_id
        - nr_interval_id
    GetNextNumberRequest:
      type: object
      properties:
        object_id:
          type: integer
        group_id:
          type: integer
      required:
        - object_id
        - group_id
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: 'Session token obtained from the login endpoint'

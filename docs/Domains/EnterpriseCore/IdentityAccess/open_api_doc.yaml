components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
        data:
          type: object
          description: 'The response payload'
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 4
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'An error occurred'
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'The given data was invalid'
        errors:
          type: object
          description: 'Validation errors keyed by field name'
          additionalProperties:
            type: array
            items:
              type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    StorePermissionTemplateRequest:
      type: object
      properties:
        template_name:
          maxLength: 255
          type: string
        template_key:
          maxLength: 100
          type: string
        description:
          nullable: true
          type: string
        permissions:
          type: array
          items:
            type: object
        is_active:
          type: boolean
      required:
        - template_name
        - template_key
        - permissions
    UpdatePermissionTemplateRequest:
      type: object
      properties:
        template_name:
          maxLength: 255
          type: string
        template_key:
          maxLength: 100
          type: string
        description:
          nullable: true
          type: string
        permissions:
          type: array
          items:
            type: object
        is_active:
          type: boolean
    ApplyPermissionTemplateRequest:
      type: object
      properties:
        template_id:
          type: integer
        user_ids:
          type: array
          items:
            type: object
          properties:
            '*':
              type: string
      required:
        - template_id
        - user_ids
    StoreUserRequest:
      type: object
      properties:
        username:
          maxLength: 50
          type: string
        password:
          minLength: 6
          type: string
        full_name:
          maxLength: 100
          nullable: true
          type: string
        role:
          maxLength: 20
          nullable: true
          type: string
        role_id:
          nullable: true
          type: integer
        is_active:
          nullable: true
          type: boolean
        manager_id:
          nullable: true
          type: integer
      required:
        - username
        - password
    UpdateUserRequest:
      type: object
      properties:
        id:
          type: integer
        username:
          maxLength: 50
          type: string
        password:
          minLength: 6
          nullable: true
          type: string
        full_name:
          maxLength: 100
          nullable: true
          type: string
        role:
          maxLength: 20
          nullable: true
          type: string
        role_id:
          nullable: true
          type: integer
        is_active:
          nullable: true
          type: boolean
        manager_id:
          nullable: true
          type: integer
      required:
        - id
        - username
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          minLength: 6
          type: string
      required:
        - current_password
        - new_password
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: 'Session token obtained from the login endpoint'

components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
        data:
          type: object
          description: 'The response payload'
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 4
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'An error occurred'
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'The given data was invalid'
        errors:
          type: object
          description: 'Validation errors keyed by field name'
          additionalProperties:
            type: array
            items:
              type: string
    OpenCloseCenterRequest:
      type: object
      properties:
        type:
          enum:
            - cost
            - profit
          type: string
        id:
          type: integer
      required:
        - type
        - id
    BulkSyncOrgRequest:
      type: object
      properties:
        targets:
          type: array
          items:
            type: object
          properties:
            '*':
              enum:
                - cost_centers
                - profit_centers
                - job_titles
                - nodes_to_tables
              type: string
      required:
        - targets
    StoreNodeRequest:
      type: object
      properties:
        node_type_id:
          type: string
        code:
          maxLength: 32
          type: string
        attributes:
          nullable: true
          type: array
          items:
            type: object
        status:
          enum:
            - active
            - inactive
            - archived
          nullable: true
          type: string
        valid_from:
          format: date
          nullable: true
          type: string
        valid_to:
          format: date
          nullable: true
          type: string
        link:
          nullable: true
          type: array
          items:
            type: object
          properties:
            target_node_uuid:
              format: uuid
              nullable: true
              type: string
            link_type:
              maxLength: 32
              nullable: true
              type: string
            validate_constraints:
              nullable: true
              type: boolean
      required:
        - node_type_id
        - code
    UpdateNodeRequest:
      type: object
      properties:
        code:
          maxLength: 32
          type: string
        attributes:
          nullable: true
          type: array
          items:
            type: object
        status:
          enum:
            - active
            - inactive
            - archived
          nullable: true
          type: string
        valid_from:
          format: date
          nullable: true
          type: string
        valid_to:
          format: date
          nullable: true
          type: string
    StoreLinkRequest:
      type: object
      properties:
        source_node_uuid:
          format: uuid
          type: string
        target_node_uuid:
          format: uuid
          type: string
        link_type:
          maxLength: 32
          nullable: true
          type: string
        priority:
          minimum: 0.0
          nullable: true
          type: integer
        valid_from:
          format: date
          nullable: true
          type: string
        valid_to:
          format: date
          nullable: true
          type: string
      required:
        - source_node_uuid
        - target_node_uuid
    UpdateLinkRequest:
      type: object
      properties:
        link_type:
          maxLength: 32
          nullable: true
          type: string
        priority:
          minimum: 0.0
          nullable: true
          type: integer
        valid_from:
          format: date
          nullable: true
          type: string
        valid_to:
          format: date
          nullable: true
          type: string
    BulkStatusUpdateRequest:
      type: object
      properties:
        node_uuids:
          minLength: 1
          type: array
          items:
            type: object
          properties:
            '*':
              format: uuid
              type: string
        status:
          enum:
            - active
            - inactive
            - archived
          type: string
      required:
        - node_uuids
        - status
    OnboardZatcaRequest:
      type: object
      properties:
        otp:
          type: string
        csr_data:
          nullable: true
          type: array
          items:
            type: object
      required:
        - otp
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: 'Session token obtained from the login endpoint'

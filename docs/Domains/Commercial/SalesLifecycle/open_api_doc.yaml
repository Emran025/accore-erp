components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
        data:
          type: object
          description: 'The response payload'
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 4
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'An error occurred'
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'The given data was invalid'
        errors:
          type: object
          description: 'Validation errors keyed by field name'
          additionalProperties:
            type: array
            items:
              type: string
    StoreInvoiceRequest:
      type: object
      properties:
        invoice_number:
          maxLength: 50
          nullable: true
          type: string
        payment_type:
          enum:
            - cash
            - credit
          type: string
        customer_id:
          nullable: true
          type: integer
        amount_paid:
          minimum: 0.0
          nullable: true
          type: number
        discount_amount:
          minimum: 0.0
          nullable: true
          type: number
        items:
          minLength: 1
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              quantity:
                minimum: 1.0
                type: integer
              unit_price:
                minimum: 0.0
                type: number
              unit_type:
                enum:
                  - main
                  - sub
                  - piece
                  - package
                nullable: true
                type: string
            required:
              - product_id
              - quantity
              - unit_price
        sales_representative_id:
          nullable: true
          type: integer
        vat_rate:
          minimum: 0.0
          maximum: 100.0
          nullable: true
          type: number
      required:
        - payment_type
        - items
    StoreSalesReturnRequest:
      type: object
      properties:
        invoice_id:
          type: integer
        items:
          minLength: 1
          type: array
          items:
            type: object
            properties:
              invoice_item_id:
                type: integer
              return_quantity:
                minimum: 1.0
                type: integer
            required:
              - invoice_item_id
              - return_quantity
        reason:
          maxLength: 500
          nullable: true
          type: string
      required:
        - invoice_id
        - items
    SubmitZatcaRequest:
      type: object
      properties:
        submission_type:
          enum:
            - reporting
            - clearance
          nullable: true
          type: string
    StoreServiceRequest:
      type: object
      properties:
        name:
          maxLength: 255
          type: string
        description:
          nullable: true
          type: string
        category_id:
          nullable: true
          type: integer
        unit_price:
          minimum: 0.0
          type: number
        minimum_profit_margin:
          minimum: 0.0
          nullable: true
          type: number
        taxable:
          type: boolean
        unit_name:
          maxLength: 50
          nullable: true
          type: string
        sub_unit_name:
          maxLength: 50
          nullable: true
          type: string
        pos_locations:
          nullable: true
          type: array
          items:
            type: object
            properties:
              pos_location:
                maxLength: 100
                type: string
              active:
                type: boolean
              effective_from:
                format: date
                nullable: true
                type: string
              effective_to:
                format: date
                nullable: true
                type: string
              notes:
                nullable: true
                type: string
            required:
              - pos_location
      required:
        - name
        - unit_price
    UpdateServiceRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          maxLength: 255
          type: string
        description:
          nullable: true
          type: string
        category_id:
          nullable: true
          type: integer
        unit_price:
          minimum: 0.0
          type: number
        minimum_profit_margin:
          minimum: 0.0
          nullable: true
          type: number
        taxable:
          type: boolean
        unit_name:
          maxLength: 50
          nullable: true
          type: string
        sub_unit_name:
          maxLength: 50
          nullable: true
          type: string
        pos_locations:
          nullable: true
          type: array
          items:
            type: object
            properties:
              pos_location:
                maxLength: 100
                type: string
              active:
                type: boolean
              effective_from:
                format: date
                nullable: true
                type: string
              effective_to:
                format: date
                nullable: true
                type: string
              notes:
                nullable: true
                type: string
            required:
              - pos_location
      required:
        - id
    StoreServiceSaleRequest:
      type: object
      properties:
        payment_type:
          enum:
            - cash
            - credit
          type: string
        customer_id:
          nullable: true
          type: integer
        amount_paid:
          minimum: 0.0
          nullable: true
          type: number
        discount_amount:
          minimum: 0.0
          nullable: true
          type: number
        invoice_number:
          maxLength: 50
          nullable: true
          type: string
        items:
          minLength: 1
          type: array
          items:
            type: object
            properties:
              service_id:
                type: integer
              quantity:
                minimum: 0.01
                type: number
              unit_price:
                minimum: 0.0
                type: number
              description:
                nullable: true
                type: string
            required:
              - service_id
              - quantity
              - unit_price
      required:
        - payment_type
        - items
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: 'Session token obtained from the login endpoint'

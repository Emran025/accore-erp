name: Desktop application

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build desktop (${{ matrix.artifact }} / ${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            flavor: client
            feature: client-product
            args: ""
            artifact: client-linux-x64
            acceptance: ""
          - platform: windows-latest
            flavor: server
            feature: server-product
            args: ""
            artifact: server-windows-x64
            acceptance: server-desktop
          - platform: windows-latest
            flavor: server
            feature: headless-server-product
            config: headless-server
            args: ""
            artifact: server-headless-windows-x64
            acceptance: server-headless
          - platform: windows-latest
            flavor: client
            feature: client-product
            args: ""
            artifact: client-windows-x64
            acceptance: ""
          - platform: macos-latest
            flavor: client
            feature: client-product
            args: "--target aarch64-apple-darwin"
            artifact: client-macos-arm64
            acceptance: ""
          - platform: macos-latest
            flavor: client
            feature: client-product
            args: "--target x86_64-apple-darwin"
            artifact: client-macos-x64
            acceptance: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout --foreground 8m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo timeout --foreground 8m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify flavor-specific NSIS icons
        working-directory: frontend
        run: npm run desktop:verify-flavor-icons -- ${{ matrix.flavor }}

      - name: Set up PHP build tooling for Server Desktop
        if: matrix.flavor == 'server'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: fileinfo

      - name: Install production Laravel dependencies for Server Desktop
        if: matrix.flavor == 'server'
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare verified Server Desktop runtime
        if: matrix.flavor == 'server'
        working-directory: frontend
        env:
          ACCORE_RUNTIME_DOWNLOAD_CACHE: ${{ runner.temp }}/accore-runtime-cache
        run: npm run desktop:prepare-server-runtime

      - name: Build ACCORE Server Agent sidecar
        if: matrix.flavor == 'server'
        shell: pwsh
        run: |
          cargo build --manifest-path distribution/crates/accore-server-agent/Cargo.toml --release
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          Copy-Item distribution/crates/accore-server-agent/target/release/accore-server-agent.exe frontend/src-tauri/binaries/accore-server-agent-x86_64-pc-windows-msvc.exe

      - name: Generate updater configuration for signed release
        if: startsWith(github.ref, 'refs/tags/desktop-v') && matrix.artifact != 'server-headless-windows-x64'
        working-directory: frontend
        env:
          ACCORE_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.ACCORE_TAURI_UPDATER_PUBLIC_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/create-tauri-updater-release-config.mjs
          ${{ matrix.flavor }}
          src-tauri/tauri.release.generated.conf.json

      - name: Build and upload desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ACCORE_PRODUCT_FLAVOR: ${{ matrix.flavor }}
          NEXT_PUBLIC_ACCORE_PRODUCT_FLAVOR: ${{ matrix.flavor }}
          NEXT_PUBLIC_ACCORE_SERVER_API_BASE: ${{ matrix.flavor == 'server' && 'http://127.0.0.1:8765/api' || '' }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.${{ matrix.config || matrix.flavor }}.conf.json --features ${{ matrix.feature }} ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/desktop-v') && matrix.artifact != 'server-headless-windows-x64' && '--config src-tauri/tauri.release.generated.conf.json' || '' }}
          uploadWorkflowArtifacts: false

      - name: Accept isolated ACCORE Server product lifecycle
        if: matrix.acceptance != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isHeadless = '${{ matrix.acceptance }}' -eq 'server-headless'
          $installerPattern = if ($isHeadless) { '*Headless*setup.exe' } else { '*Server*Desktop*setup.exe' }
          $installer = Get-ChildItem -Path 'frontend/src-tauri/target' -Recurse -File -Filter $installerPattern | Select-Object -First 1
          if ($null -eq $installer) { throw "The ${{ matrix.acceptance }} NSIS installer was not produced" }
          $installationDirectory = if ($isHeadless) {
            Join-Path $env:ProgramFiles 'ACCORE ERP Server Headless'
          } else {
            Join-Path $env:ProgramFiles 'ACCORE ERP Server Desktop'
          }
          & .github/scripts/accept-windows-server-product.ps1 `
            -Product '${{ matrix.acceptance }}' `
            -InstallerPath $installer.FullName `
            -InstallationDirectory $installationDirectory

      - name: Prepare redacted server lifecycle diagnostics
        if: failure() && matrix.acceptance != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'accore-server-lifecycle-diagnostics'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $statusRoot = Join-Path $env:ProgramData 'ACCORE ERP\Server Status'
          foreach ($name in @('runtime-status.json', 'backup-status.json')) {
            $source = Join-Path $statusRoot $name
            if (Test-Path $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $destination $name) -Force
            }
          }
          $redactedLogs = @{
            'provisioning.tail.redacted.log' = Join-Path $env:ProgramData 'ACCORE ERP\Server\logs\provisioning.log'
            'api-preflight.tail.redacted.log' = Join-Path $env:ProgramData 'ACCORE ERP\Server\logs\api-preflight.log'
            'frankenphp-api.tail.redacted.log' = Join-Path $env:ProgramData 'ACCORE ERP\Server\logs\api.log'
            'laravel.tail.redacted.log' = Join-Path $env:ProgramData 'ACCORE ERP\Server\laravel-storage\logs\laravel.log'
          }
          foreach ($entry in $redactedLogs.GetEnumerator()) {
            if (Test-Path $entry.Value) {
              Get-Content -LiteralPath $entry.Value -Tail 250 | ForEach-Object {
                $_ -replace '(?i)(password|secret|token|app_key)\s*([:=])\s*\S+', '$1$2[REDACTED]'
              } | Set-Content -LiteralPath (Join-Path $destination $entry.Key)
            }
          }

      - name: Upload redacted server lifecycle diagnostics
        if: failure() && matrix.acceptance != ''
        uses: actions/upload-artifact@v4
        with:
          name: accore-${{ matrix.acceptance }}-lifecycle-diagnostics
          if-no-files-found: warn
          path: ${{ runner.temp }}/accore-server-lifecycle-diagnostics

      - name: Upload desktop installers and updater signatures
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: actions/upload-artifact@v4
        with:
          name: accore-${{ matrix.artifact }}-assets
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/**/bundle/**/*.AppImage
            frontend/src-tauri/target/**/bundle/**/*.deb
            frontend/src-tauri/target/**/bundle/**/*.rpm
            frontend/src-tauri/target/**/bundle/**/*.msi
            frontend/src-tauri/target/**/bundle/**/*.exe
            frontend/src-tauri/target/**/bundle/**/*.dmg
            frontend/src-tauri/target/**/bundle/**/*.tar.gz
            frontend/src-tauri/target/**/bundle/**/*.sig

  release-desktop:
    name: Create desktop release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata generator
        uses: actions/checkout@v4

      - name: Set up Node.js for manifest generation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "accore-*-assets"
          path: release-assets

      - name: Stage publishable desktop release assets
        run: >-
          node frontend/scripts/stage-desktop-release-assets.mjs
          release-assets
          release-publish-assets

      - name: Generate signed release manifests
        env:
          ACCORE_RELEASE_TAG: ${{ github.ref_name }}
          ACCORE_SOURCE_REVISION: ${{ github.sha }}
          ACCORE_MANIFEST_KEY_ID: ${{ secrets.ACCORE_MANIFEST_KEY_ID }}
          ACCORE_MANIFEST_PRIVATE_KEY: ${{ secrets.ACCORE_MANIFEST_PRIVATE_KEY }}
          ACCORE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: node frontend/scripts/create-release-manifests.mjs release-publish-assets release-manifests

      - name: Create GitHub release and upload installers
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ACCORE ERP Desktop Release (${{ github.ref_name }})
          generate_release_notes: true
          files: |
            release-publish-assets/**
            release-manifests/**

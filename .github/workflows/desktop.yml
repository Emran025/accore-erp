name: Desktop application

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build desktop (${{ matrix.flavor }} / ${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            flavor: server
            feature: server-product
            args: ""
          - platform: ubuntu-22.04
            flavor: client
            feature: client-product
            args: ""
          - platform: windows-latest
            flavor: server
            feature: server-product
            args: ""
          - platform: windows-latest
            flavor: client
            feature: client-product
            args: ""
          - platform: macos-latest
            flavor: server
            feature: server-product
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            flavor: client
            feature: client-product
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            flavor: server
            feature: server-product
            args: "--target x86_64-apple-darwin"
          - platform: macos-latest
            flavor: client
            feature: client-product
            args: "--target x86_64-apple-darwin"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate updater configuration for signed release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: frontend
        env:
          ACCORE_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.ACCORE_TAURI_UPDATER_PUBLIC_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/create-tauri-updater-release-config.mjs
          ${{ matrix.flavor }}
          src-tauri/tauri.release.generated.conf.json

      - name: Build and upload desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ACCORE_PRODUCT_FLAVOR: ${{ matrix.flavor }}
          NEXT_PUBLIC_ACCORE_PRODUCT_FLAVOR: ${{ matrix.flavor }}
          NEXT_PUBLIC_ACCORE_SERVER_API_BASE: ${{ matrix.flavor == 'server' && 'http://127.0.0.1:8765/api' || '' }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.${{ matrix.flavor }}.conf.json --features ${{ matrix.feature }} ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/desktop-v') && '--config src-tauri/tauri.release.generated.conf.json' || '' }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "accore-${{ matrix.flavor }}-[platform]-[arch]-[bundle]"

  release-desktop:
    name: Create desktop release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata generator
        uses: actions/checkout@v4

      - name: Set up Node.js for manifest generation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "accore-*-*"
          path: release-assets
          merge-multiple: true

      - name: Generate signed release manifests
        env:
          ACCORE_RELEASE_TAG: ${{ github.ref_name }}
          ACCORE_SOURCE_REVISION: ${{ github.sha }}
          ACCORE_MANIFEST_KEY_ID: ${{ secrets.ACCORE_MANIFEST_KEY_ID }}
          ACCORE_MANIFEST_PRIVATE_KEY: ${{ secrets.ACCORE_MANIFEST_PRIVATE_KEY }}
          ACCORE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: node frontend/scripts/create-release-manifests.mjs release-assets release-manifests

      - name: Create GitHub release and upload installers
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Accore ERP ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**
            release-manifests/**
